[package]
name = "vpn-splitter-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gpui = { version = "=0.2.2", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "8166e3d7b8b42d8aaf4d4dee7fcd25ab4ec65105", features = ["font-kit"] }
gpui-tray = { version = "=0.1.4", features = ["menu-state"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSRunningApplication"] }

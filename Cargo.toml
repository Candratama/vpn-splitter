[workspace]
members = ["crates/desktop", "crates/core", "crates/helper"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"
publish = false

[patch.crates-io]
gpui = { version = "=0.2.2", git = "https://github.com/zed-industries/zed.git", rev = "8166e3d7b8b42d8aaf4d4dee7fcd25ab4ec65105" }

[profile.release]
debug = 0
strip = "debuginfo"

[profile.release.package.gpui_windows]
debug-assertions = true
